# vme-stack tasks (https://taskfile.dev). `task --list` shows them all.
#
#   task check                    lint + tests, as CI runs them
#   task release VERSION=0.1.1    checks, bump, changelog, commit, tag (local only)
#   task release:push             push main + the tag; the ee-release workflow builds the image
#
# The Python tools (ansible-lint, ruff, ...) live in .venv. `task setup` builds it from
# requirements-dev.txt; lint and test run it first, so there is nothing to do by hand.
# Install Docker (ee:*) yourself.
version: "3"

vars:
  # Python for .venv: PYTHON=<command>, else the newest that ansible-core 2.21
  # supports (3.12 to 3.14) and can make a venv (Debian/Ubuntu: python3.X-venv)
  # found here, else python3 (setup then says what is wrong).
  PYTHON:
    sh: for v in 3.14 3.13 3.12; do if python$v -c "import ensurepip" 2>/dev/null; then echo python$v; exit 0; fi; done; echo python3
  EE_VERSION:
    sh: cat ee/VERSION

tasks:
  default:
    cmds: [task --list]
    silent: true

  setup:
    desc: Build .venv from requirements-dev.txt (skipped while that file is unchanged)
    status:
      # .venv keeps a copy of the requirements it was built from; one built with a
      # Python ansible-core does not support is built again.
      - cmp -s requirements-dev.txt .venv/requirements-dev.txt
      - .venv/bin/python -c "import sys; assert (3, 12) <= sys.version_info[:2] <= (3, 14)"
    vars:
      # For the messages below: the Python versions ansible-core 2.21 supports
      # (3.12 to 3.14) found on this machine that can make a venv, and the version
      # PYTHON is.
      PYTHONS_FOUND:
        sh: for v in 3.14 3.13 3.12; do if python$v -c "import ensurepip" 2>/dev/null; then printf 'python%s ' $v; fi; done
      PYTHON_VERSION:
        sh: '{{.PYTHON}} -c "import sys; print(\"%d.%d\" % sys.version_info[:2])" 2>/dev/null || true'
    preconditions:
      - sh: command -v "{{.PYTHON}}" >/dev/null
        msg: >-
          PYTHON={{.PYTHON}}: no such command.
          {{if .PYTHONS_FOUND}}Found here: {{.PYTHONS_FOUND}}- e.g. task setup PYTHON={{index (splitList " " .PYTHONS_FOUND) 0}}
          {{- else}}None of python3.12, python3.13, python3.14 (with venv) found: install one (ansible-core 2.21 needs 3.12-3.14).{{end}}
      - sh: '{{.PYTHON}} -c "import sys; assert (3, 12) <= sys.version_info[:2] <= (3, 14)"'
        msg: >-
          PYTHON={{.PYTHON}} is Python {{.PYTHON_VERSION | default "?"}}; ansible-core 2.21 needs 3.12-3.14.
          {{if .PYTHONS_FOUND}}Found here: {{.PYTHONS_FOUND}}- e.g. task setup PYTHON={{index (splitList " " .PYTHONS_FOUND) 0}}
          {{- else}}None of python3.12, python3.13, python3.14 (with venv) found: install one.{{end}}
      - sh: '{{.PYTHON}} -c "import ensurepip"'
        msg: >-
          PYTHON={{.PYTHON}} cannot make a venv (Debian/Ubuntu: apt install python{{.PYTHON_VERSION}}-venv).
          {{if .PYTHONS_FOUND}}Found here: {{.PYTHONS_FOUND}}- e.g. task setup PYTHON={{index (splitList " " .PYTHONS_FOUND) 0}}
          {{- else}}No python3.12-3.14 with venv found here.{{end}}
    cmds:
      - rm -rf .venv
      - '{{.PYTHON}} -m venv .venv'
      - .venv/bin/pip install -q --disable-pip-version-check -r requirements-dev.txt
      - cp requirements-dev.txt .venv/

  clean:
    desc: Remove .venv
    cmds:
      - rm -rf .venv

  check:
    desc: Lint and tests, as CI runs them
    cmds:
      - task: lint
      - task: test

  lint:
    desc: ansible-lint, yamllint, ruff, shellcheck, actionlint
    deps: [setup]
    cmds:
      - .venv/bin/ansible-lint            # paths and profile: .ansible-lint
      - .venv/bin/yamllint .
      - .venv/bin/ruff check
      - .venv/bin/ruff format --check
      - .venv/bin/shellcheck ee/build.sh ee/files/vme-stack-entrypoint
      - .venv/bin/actionlint

  test:
    desc: Site files and rule cases, playbook syntax, release docs
    deps: [setup]
    cmds:
      # every site file passes, every case in site_cases.yml fails with its message
      - .venv/bin/python ansible/tests/check_sites.py sites/*/inventory.yml ansible/examples/*/inventory.yml --cases ansible/tests/site_cases.yml
      # playbook syntax (the example site needs no vault)
      - |
        cd ansible
        for pb in *.yml; do
          ../.venv/bin/ansible-playbook "$pb" -i examples/baremetal/inventory.yml --syntax-check >/dev/null || exit 1
        done
      # CHANGELOG, tested-with table and image pins match ee/VERSION
      - .venv/bin/python scripts/release.py docs
      # docs/variables.md matches the argument spec (task docs writes it)
      - .venv/bin/python scripts/variables_doc.py --check

  docs:
    desc: Write docs/variables.md from the site variables' argument spec
    deps: [setup]
    cmds:
      - .venv/bin/python scripts/variables_doc.py

  ee:build:
    desc: Build the EE image from the committed code (options in ee/build.sh)
    cmds:
      - ee/build.sh

  ee:smoke:
    desc: Smoke-test the local image vme-stack-ee:<ee/VERSION>
    cmds:
      - docker run --rm vme-stack-ee:{{.EE_VERSION}} ansible --version
      - docker run --rm vme-stack-ee:{{.EE_VERSION}} /usr/bin/python3.12 -c "import passlib"
      - docker run --rm vme-stack-ee:{{.EE_VERSION}} ansible-inventory -i examples/baremetal/inventory.yml --graph
      - docker run --rm vme-stack-ee:{{.EE_VERSION}} cat VERSION | grep -qx "{{.EE_VERSION}}"

  release:
    desc: "Check, bump, commit and tag a release: task release VERSION=X.Y.Z"
    requires:
      vars: [VERSION]
    cmds:
      # refuses if: not X.Y.Z above the last tag, tree not clean, not on an up-to-date
      # main, nothing under "## [Unreleased]" in CHANGELOG.md (OFFLINE=true: no fetch)
      - python3 scripts/release.py preflight {{.VERSION}} {{if .OFFLINE}}--offline{{end}}
      - task: check
      # ee/VERSION, CHANGELOG section, tested-with row, image pins; commit "Release X.Y.Z"
      - python3 scripts/release.py prepare {{.VERSION}}
      - git tag v{{.VERSION}}
      - echo "Tagged v{{.VERSION}}. Publish with -> task release:push"

  release:push:
    desc: Push main and the release tag (starts the ee-release workflow)
    prompt: "Push main and v{{.EE_VERSION}} to origin?"
    preconditions:
      - sh: git rev-parse -q --verify "refs/tags/v{{.EE_VERSION}}" >/dev/null
        msg: "tag v{{.EE_VERSION}} does not exist: run task release VERSION={{.EE_VERSION}} first"
    cmds:
      - git push origin main "v{{.EE_VERSION}}"
