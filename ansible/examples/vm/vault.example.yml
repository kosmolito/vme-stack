# Copy to group_vars/all/vault.yml, fill in, then: ansible-vault encrypt group_vars/all/vault.yml
vault_vme_admin: "<Manager admin password>"
vault_hvm_admin_password: "<password of the hosts' admin user>"
# Key pair the Manager uses to reach the hosts: ssh-keygen -t ed25519 -N '' -f mgr
vault_vme_manager_ssh_private_key: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  ...
  -----END OPENSSH PRIVATE KEY-----
vault_vme_manager_ssh_public_key: "ssh-ed25519 AAAA... vme-manager"
