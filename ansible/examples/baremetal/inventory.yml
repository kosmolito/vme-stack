# Scenario: physical servers, HPE iLO and Dell iDRAC (vendor detected at run time).
# The pipeline boots each server over Redfish from its ISO (platform: redfish), so
# a run goes from powered-off servers to a cluster without anyone at a console.
# The site file is a plain Ansible inventory; every setting: sites/example/inventory.yml.
# Steps: README.md. Secrets: group_vars/all/vault.yml (template: vault.example.yml, not loaded).
all:
  vars:
    site: example-prod

    network:
      domain: example.com
      gateway: 10.20.0.1
      prefix: 24
      mgmt_vlan: 100
      compute_vlans: [200, 201]
      dns: [10.20.0.10, 10.20.0.11]
      ntp: [10.20.0.10, 10.20.0.11]
      timezone: Europe/Stockholm
      # proxy: http://proxy.example.com:3128

    vme_manager:                      # runs on the host in group vme_manager (below)
      ip: 10.20.0.30
      hostname: vme-manager
      url: https://vme-manager.example.com   # A record -> ip on every network.dns server (preflight checks)
      size: M
      admin_password: "{{ vault_vme_admin }}"
      # license_key: "{{ vault_vme_license }}"    # omit for trial
      datastore: nfs01                # a datastore of the cluster that holds hvm01
      ssh_private_key_file: ~/.ssh/acme_manager   # the Manager's key to every cluster's hosts (+ .pub); default: hvm01's key

    # Manager objects, found by name or created. A cloud can be in several groups;
    # a cluster belongs to one cloud (type hvm) and one of that cloud's groups.
    vme_groups:
      - name: production

    vme_clouds:
      - name: prod-hvm                # HPE VM private cloud for the HVM cluster(s)
        type: hvm
        groups: [production]
      - name: prod-vcenter            # existing VMware estate, next to HVM
        type: vmware
        groups: [production]
        vcenter:
          url: https://vcenter.example.com/sdk
          username: "{{ vault_vcenter.username }}"
          password: "{{ vault_vcenter.password }}"   # {username, password} in the vault; a read-only vCenter role is enough
          datacenter: DC1
          # cluster: Cluster01        # only this vCenter cluster; default the whole datacenter
          # import_existing: false    # default true: the vCenter's VMs appear in the Manager (unmanaged)

    vme_clusters:
      - name: prod-hvm01
        cloud: prod-hvm
        hosts: [hvm01, hvm02, hvm03]
        datastores:
          - {name: nfs01, type: nfs, host: 10.20.0.40, path: /export/vme, default: true}

  children:
    deploy_server:                    # builds + serves ISOs; must reach the BMCs' network too
      hosts:
        deploy:
          ansible_host: 10.20.0.5     # the BMCs fetch the ISOs from http://10.20.0.5:8080
          ansible_user: deploy        # an existing login with passwordless sudo
          ansible_ssh_private_key_file: ~/.ssh/acme_deploy   # its key; without this line ~/.ssh/id_ed25519
          media:                      # ISOs on this server; it builds and serves the install media
            hvm_iso_path: /srv/vme-stack/src/HPE_HVM_Install_24.04_S5Q83-11078.iso
            vme_iso_path: /srv/vme-stack/src/HPE_VM_Essentials_SW_image_v9.0.2_2_S6E64-11258.iso

    hvm:
      vars:
        platform: redfish
        ansible_user: hvmadmin        # the hosts' admin user, created by the install
        ansible_ssh_private_key_file: ~/.ssh/acme_hvm      # its key, the public key is installed; default ~/.ssh/id_ed25519
        hvm_admin_password: "{{ vault_hvm_admin_password }}"
        nic_layout: dedicated
      hosts:
        hvm01:
          ansible_host: 10.20.0.21
          bmc:
            address: 10.20.1.21
            username: "{{ vault_ilo.username }}"     # secrets: references to the vault, see vault.example.yml
            password: "{{ vault_ilo.password }}"
            bios_setup: true                         # opt-in: UEFI + Secure Boot off
          nics:
            mgmt: ["b4:7a:f1:00:00:01", "b4:7a:f1:00:00:02"]
            compute: ["b4:7a:f1:00:00:03", "b4:7a:f1:00:00:04"]
        hvm02:
          ansible_host: 10.20.0.22
          bmc: {address: 10.20.1.22, username: "{{ vault_ilo.username }}", password: "{{ vault_ilo.password }}"}
          boot_disk: {model: "*NS204i*"}   # installer match keys (globs); auto = smallest disk
          nics:
            mgmt: ["b4:7a:f1:00:01:01", "b4:7a:f1:00:01:02"]
            compute: ["b4:7a:f1:00:01:03", "b4:7a:f1:00:01:04"]
        hvm03:
          ansible_host: 10.20.0.23
          bmc: {address: 10.20.1.23, username: "{{ vault_idrac.username }}", password: "{{ vault_idrac.password }}"}
          nics:
            mgmt: ["d0:94:66:00:00:01", "d0:94:66:00:00:02"]
            compute: ["d0:94:66:00:00:03", "d0:94:66:00:00:04"]

    vme_manager:                      # the host that runs the Manager VM
      hosts:
        hvm01:
