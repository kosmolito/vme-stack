# Copy to group_vars/all/vault.yml, fill in, then: ansible-vault encrypt group_vars/all/vault.yml
vault_vme_admin: "<Manager admin password>"
vault_hvm_admin_password: "<password of the hosts' admin user>"
# vault_vme_license: "<VME license key>"
# vCenter login: vme_clouds[].vcenter.username/password (clouds on one vCenter can share it)
vault_vcenter: { username: "<user>@vsphere.local", password: "<vCenter password>" }
# BMC logins: the hosts' bmc.username/password ("{{ vault_ilo.username }}", ...); one per server works too
vault_ilo: { username: "<iLO user>", password: "<iLO password>" }
vault_idrac: { username: "<iDRAC user>", password: "<iDRAC password>" }
