---
# Check a site inventory without contacting any machine: its secrets resolve, every
# variable (types, required, allowed values) and the rules across them. Preflight
# runs the same first; this is for editing a site file and for CI.
#   ansible-playbook validate.yml -i ../sites/<site>/site.yml --ask-vault-pass
- name: Site inventory shape
  hosts: localhost
  gather_facts: false
  tasks:
    - name: The inventory is a vme-stack site (groups hvm and deploy_server)
      ansible.builtin.assert:
        that:
          - groups['hvm'] | default([]) | length > 0
          - groups['deploy_server'] | default([]) | length > 0
          - site is defined and network is defined and media is defined
        fail_msg: >-
          {{ inventory_file | default(ansible_inventory_sources | join(', ')) }} is not a vme-stack site inventory:
          it needs hosts in groups hvm and deploy_server and site, network, media in all.vars
          (a site file from before 0.1.4 has the old format; see sites/example/site.yml)
        quiet: true

- name: Validate the site inventory
  hosts: hvm
  gather_facts: false
  tasks:
    - name: Site inventory
      ansible.builtin.include_role:
        name: preflight
        tasks_from: site
