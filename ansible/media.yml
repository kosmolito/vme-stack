---
# Stages 1-2 only: build and publish the ISOs of hosts that need an install,
# then stop. For platform manual (e.g. lab Terraform), run this first, boot the
# hosts from build/<host>/iso_url, then run hvm_hosts.yml to wait + post-install.
#   ansible-playbook media.yml -i ../sites/<site>/site.yml [--limit <host>]
- name: Preflight
  ansible.builtin.import_playbook: preflight.yml

- name: Media server
  ansible.builtin.import_playbook: media_server.yml

- name: Build install media
  hosts: hvm
  gather_facts: false
  tasks:
    - name: Check host state
      ansible.builtin.import_role:
        name: host_state

    - name: Build and publish the ISO
      when: install_now | bool
      block:
        - name: Render the seed
          ansible.builtin.import_role:
            name: seed
        - name: Build and publish the install ISO
          ansible.builtin.import_role:
            name: media

    # The URL of every host, also when nothing was built now: an installed host's
    # ISO was removed after its install, so say whether it is there.
    - name: Check the ISO on the deploy server
      ansible.builtin.stat:
        path: "{{ media_www_root }}/isos/hvm-{{ inventory_hostname }}.iso"
        get_checksum: false
      delegate_to: "{{ deploy_host }}"
      register: iso_present

    - name: ISO URL
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ media_url }}/isos/hvm-{{ inventory_hostname }}.iso
          {{ '(built now)' if install_now | bool
             else '(on the deploy server; host installed already)' if iso_present.stat.exists
             else '(not on the deploy server: host installed already; build it with -e force_reinstall=true --limit '
                  ~ inventory_hostname ~ ')' }}
