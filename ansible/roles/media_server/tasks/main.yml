---
# The deploy server builds per-host ISOs (xorriso) and serves them over HTTP —
# or HTTPS with media.https (the site's cert/key, or a generated self-signed
# pair) — (nginx) to BMCs and hypervisors. Debian/Ubuntu (apt) or RHEL family (dnf);
# SELinux is switched to permissive, an active firewall gets the media port. Tasks are
# delegated, so this works under --limit <host> too; call it once per run
# (linear play, run_once).
- name: Read the deploy server's package manager, SELinux and firewall state
  ansible.builtin.shell: |
    set -o pipefail
    if command -v apt-get >/dev/null; then echo apt; elif command -v dnf >/dev/null; then echo dnf; else echo none; fi
    if command -v getenforce >/dev/null; then getenforce; else echo Disabled; fi
    s=$(systemctl is-active firewalld 2>/dev/null) || true; echo "${s:-none}"   # always one line
    if command -v ufw >/dev/null; then { sudo -n ufw status 2>/dev/null || echo "Status: unknown"; } | head -1; else echo "Status: none"; fi
  args:
    executable: /bin/bash
  delegate_to: "{{ deploy_host }}"
  register: deploy_os_raw
  changed_when: false

- name: Remember the deploy server's state
  ansible.builtin.set_fact:
    deploy_pkg: "{{ deploy_os_raw.stdout_lines[0] }}"
    deploy_selinux: "{{ deploy_os_raw.stdout_lines[1] | trim == 'Enforcing' }}"
    deploy_firewalld: "{{ deploy_os_raw.stdout_lines[2] | trim == 'active' }}"
    deploy_ufw: "{{ deploy_os_raw.stdout_lines[3] | trim == 'Status: active' }}"

- name: Install nginx and xorriso (apt)
  ansible.builtin.apt:
    name: [nginx, xorriso]
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  delegate_to: "{{ deploy_host }}"
  when: deploy_pkg == 'apt'

- name: Install nginx and xorriso (dnf)
  ansible.builtin.dnf:
    name: [nginx, xorriso]
    state: present
  become: true
  delegate_to: "{{ deploy_host }}"
  when: deploy_pkg == 'dnf'

# The user the pipeline works as there (ssh user, or the local user with connection: local).
- name: Read the deploy server's login user
  ansible.builtin.command: id -un
  delegate_to: "{{ deploy_host }}"
  register: deploy_login
  changed_when: false

- name: Create media directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_login.stdout }}"
    mode: "0755"
  loop:
    - "{{ media_www_root }}"
    - "{{ media_www_root }}/isos"
    - "{{ media_work_dir }}"
  become: true
  delegate_to: "{{ deploy_host }}"

# --- TLS (media.https): the site's cert/key, or a generated self-signed pair ----
- name: Set up TLS
  when: media_https | bool
  become: true
  delegate_to: "{{ deploy_host }}"
  block:
    - name: Check the site's cert and key exist
      when: "'cert' in deploy_media"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop: ["{{ media_tls_cert }}", "{{ media_tls_key }}"]
      register: site_tls
      failed_when: not site_tls.stat.exists

    # Self-signed, SAN = the deploy server's address plus the media_url host (when
    # a site sets an https media.url). Regenerated when missing, expiring within
    # 30 days, or the SAN no longer matches (e.g. the address changed).
    - name: Generate a self-signed certificate
      when: "'cert' not in deploy_media"
      vars:
        san_hosts: "{{ [hostvars[deploy_host].ansible_host | default(deploy_host), media_url | urlsplit('hostname')] | unique }}"
        san: >-
          {{ san_hosts | map('regex_replace', '^(\d+\.\d+\.\d+\.\d+)$', 'IP:\1')
                       | map('regex_replace', '^(?!IP:)(.*)$', 'DNS:\1') | join(',') }}
      ansible.builtin.shell: |
        set -euo pipefail
        crt={{ media_tls_cert | quote }} key={{ media_tls_key | quote }} san={{ san | quote }}
        if [ -f "$crt" ] && [ -f "$key" ] && openssl x509 -in "$crt" -noout -checkend 2592000 >/dev/null; then
          have=$(openssl x509 -in "$crt" -noout -ext subjectAltName | tr -d ' \n' \
                 | sed 's/IPAddress:/IP:/g; s/^.*Name://')
          ok=1
          for e in $(printf %s "$san" | tr ',' '\n'); do
            case ",$have," in *",$e,"*) ;; *) ok=0 ;; esac
          done
          [ "$ok" = 1 ] && exit 0
        fi
        mkdir -p "$(dirname "$crt")" "$(dirname "$key")"
        umask 077
        openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
          -keyout "$key" -out "$crt" -subj "/CN=vme-stack media" -addext "subjectAltName=$san"
        chmod 644 "$crt"
        echo changed
      args:
        executable: /bin/bash
      register: tls_gen
      changed_when: "'changed' in tls_gen.stdout"
      notify: Reload nginx

# --- SELinux: off on the deploy server (decided 2026-10-11) --------------------
# Permissive instead of disabled: takes effect at once and survives reboots
# (disabling needs a reboot and, on RHEL 9, a kernel argument).
- name: Switch SELinux to permissive
  when: deploy_selinux | bool
  become: true
  delegate_to: "{{ deploy_host }}"
  block:
    - name: Stop enforcing now
      ansible.builtin.command: setenforce 0
      changed_when: true

    - name: Stay permissive after reboots
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: SELINUX=permissive

# --- Firewall (when active): open the media port --------------------------------
- name: "Open the media port in firewalld: {{ media_port }}"
  ansible.builtin.shell: |
    firewall-cmd --query-port={{ media_port }}/tcp >/dev/null && exit 0
    firewall-cmd --permanent --add-port={{ media_port }}/tcp && firewall-cmd --reload && echo changed
  become: true
  delegate_to: "{{ deploy_host }}"
  register: fw_port
  changed_when: "'changed' in fw_port.stdout"
  when: deploy_firewalld | bool

- name: "Open the media port in ufw: {{ media_port }}"
  ansible.builtin.shell: |
    set -o pipefail
    status=$(ufw status)
    grep -qE '^{{ media_port }}/tcp\s+ALLOW' <<< "$status" && exit 0
    ufw allow {{ media_port }}/tcp && echo changed
  args:
    executable: /bin/bash
  become: true
  delegate_to: "{{ deploy_host }}"
  register: ufw_port
  changed_when: "'changed' in ufw_port.stdout"
  when: deploy_ufw | bool

# conf.d is included by nginx on both families (sites-enabled only on Debian).
- name: Configure the nginx media site
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: /etc/nginx/conf.d/vme-stack.conf
    mode: "0644"
  become: true
  delegate_to: "{{ deploy_host }}"
  notify: Reload nginx

- name: Remove the media site from its old place (sites-enabled, older versions)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/vme-stack.conf
    state: absent
  become: true
  delegate_to: "{{ deploy_host }}"
  notify: Reload nginx

- name: Start nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true
  become: true
  delegate_to: "{{ deploy_host }}"

- name: Apply nginx changes now
  ansible.builtin.meta: flush_handlers

# With https the check also proves the certificate: validated against the cert
# file itself (self-signed; a site cert must carry its chain for this to pass).
- name: Check the media URL answers
  ansible.builtin.uri:
    url: "{{ media_url }}/isos/"
    status_code: 200
    ca_path: "{{ media_tls_cert if media_https | bool else omit }}"
  delegate_to: "{{ deploy_host }}"
