---
# The Manager VM, once its host is in a cluster (from main.yml): disk onto a
# shared datastore of that cluster (site setting), managed, autostart.
# --- the Manager VM onto shared storage ----------------------------------------
# hpe-vm puts the Manager's disk on the host's local pool. Its own "Reconfigure
# server" (PUT /api/servers/<id>/resize) can move a volume to another datastore;
# the local copy is kept (deleteOriginalVolumes: false).

- name: Move the Manager VM's disk to {{ manager.datastore | default('-') }}
  when: manager.datastore | default('', true) | length > 0
  block:
    - name: Find the Manager VM in the Manager
      ansible.builtin.uri:
        url: "{{ vme_api }}/servers?name={{ manager.hostname | urlencode }}"
        validate_certs: false
        headers: "{{ vme_headers }}"
      delegate_to: "{{ probe_from }}"
      register: mgr_find
      failed_when: mgr_find.json.servers | selectattr('name', 'equalto', manager.hostname) | list | length != 1

    - name: Read the Manager VM and the target datastore
      ansible.builtin.set_fact:
        mgr_server: "{{ mgr_find.json.servers | selectattr('name', 'equalto', manager.hostname) | first }}"
        mgr_target_ds: "{{ vme_manager_cluster_ds | selectattr('name', 'equalto', manager.datastore) | first }}"

    - name: Set the root volume
      ansible.builtin.set_fact:
        mgr_root: "{{ mgr_server.volumes | selectattr('rootVolume') | first }}"
        mgr_move_ok: "{{ ((mgr_server.volumes | selectattr('rootVolume') | first).datastore.id | default(0)) == mgr_target_ds.id }}"
        mgr_move_tried: false
        mgr_move_failed: []

    # The resize is asynchronous and its first run can fail transiently in
    # libvirt ("absolute path must be used as block copy target"; seen on VME
    # 9.1.0 and reported on 8.0.5, where the same move passed on a retry), so
    # each attempt watches the server's processes and a failed move is retried
    # once. Nothing is retried while a move may still be running: the second
    # attempt needs a finished, failed process.
    - name: Move the Manager VM's root volume
      ansible.builtin.include_tasks: manager_vm_move.yml
      loop: [1, 2]
      loop_control:
        loop_var: mgr_move_attempt
      when: not mgr_move_ok and (mgr_move_attempt == 1 or mgr_move_failed | length > 0)

    - name: Wait for the Manager to answer again
      ansible.builtin.uri:
        url: "https://{{ manager.ip }}/ping"
        validate_certs: false
        timeout: 10
      delegate_to: "{{ probe_from }}"
      register: mgr_ping
      until: mgr_ping.status | default(0) == 200
      retries: 60
      delay: 30
      when: mgr_move_tried

    - name: Check the move
      ansible.builtin.assert:
        that: mgr_move_ok
        fail_msg: >-
          The Manager's root volume is not on {{ manager.datastore }}
          {{- '; the Manager reported: ' ~ (failed_lines | join('; ')) if failed_lines else '' -}}
          ; check the server's history in the Manager
        success_msg: "The Manager's root volume is on {{ manager.datastore }}"
      vars:
        failed_lines: >-
          {%- set out = [] -%}
          {%- for p in mgr_move_failed -%}
          {{-   out.append((p.displayName | default('process', true)) ~ ' ' ~ (p.status | default('')) ~ ': '
                           ~ (p.error | default(p.message | default(p.output | default('no message', true), true), true))) -}}
          {%- endfor -%}
          {{ out }}

# --- the Manager VM as a managed VM ---------------------------------------------
# hpe-vm's VM is only "discovered" (kvmUnmanaged). Convert to managed, as the
# UI's "Convert to Managed": owned by its cluster's group, the Manager can
# operate it like any other VM. No agent is installed into the Manager VM.

- name: Read the Manager VM's record
  ansible.builtin.uri:
    url: "{{ vme_api }}/servers?name={{ manager.hostname | urlencode }}"
    validate_certs: false
    headers: "{{ vme_headers }}"
  delegate_to: "{{ probe_from }}"
  register: mgr_rec
  failed_when: mgr_rec.json.servers | selectattr('name', 'equalto', manager.hostname) | list | length != 1

# The Manager is only moved when the site says so (vme_manager.datastore): on the
# host's local datastore it goes down with that host and cannot start elsewhere.
- name: Warn when the Manager VM's disk is on its host's local datastore
  ansible.builtin.debug:
    msg: >-
      WARNING: the Manager VM's disk is on the local datastore of {{ manager.host }}: when that host fails,
      the Manager is down with it and cannot be started on another host.
      {{ ('Set vme_manager.datastore to one of ' ~ shared | join(', ')
           ~ ' and run deploy.yml again: the Manager moves its disk while running.') if shared
         else 'Add a shared datastore to its cluster (vme_clusters[].datastores) and set vme_manager.datastore.' }}
  when: root_ds.id | default(0) in local_ids or root_ds.name | default('') == 'local'
  vars:
    mgr_vm: "{{ mgr_rec.json.servers | selectattr('name', 'equalto', manager.hostname) | first }}"
    root_ds: "{{ (mgr_vm.volumes | selectattr('rootVolume') | first | default({})).datastore | default({}, true) }}"
    local_ids: "{{ vme_manager_cluster_ds | default([]) | selectattr('externalId', 'equalto', 'local') | map(attribute='id') | list }}"
    shared: "{{ (manager_clusters | selectattr('hosts', 'contains', manager.host) | first).datastores | map(attribute='name') | list }}"

- name: Convert the Manager VM to managed
  ansible.builtin.uri:
    url: "{{ vme_api }}/servers/{{ mgr_vm.id }}/make-managed"
    method: PUT
    validate_certs: false
    headers: "{{ vme_headers }}"
    body_format: json
    body:
      server:
        sshUsername: "{{ manager.admin_user }}"
        sshPassword: "{{ vme_manager.admin_password }}"
        provisionSiteId: "{{ vme_group_ids[vme_manager_group] | int }}"
      installAgent: false
    timeout: 120
  vars:
    mgr_vm: "{{ mgr_rec.json.servers | selectattr('name', 'equalto', manager.hostname) | first }}"
  delegate_to: "{{ probe_from }}"
  register: mgr_managed
  when: mgr_vm.computeServerType.code is search('[Uu]nmanaged')
  changed_when: true
  failed_when: false
  no_log: true

- name: Check the conversion
  ansible.builtin.assert:
    that: mgr_managed is skipped or (mgr_managed.status | default(0) in [200, 201] and mgr_managed.json.success | default(true))
    fail_msg: >-
      Convert to managed failed: HTTP {{ mgr_managed.status | default('?') }}
      {{ mgr_managed.json.msg | default('') }} {{ mgr_managed.json.errors | default({}) }}
    quiet: true

# A storage move redefines the VM; apply the autostart setting again.
- name: Manager VM autostart (site setting)
  ansible.builtin.include_role:
    name: vme_manager
    tasks_from: autostart.yml
