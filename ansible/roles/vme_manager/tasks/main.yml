---
# Deploy the VME Manager VM with HPE's own non-interactive installer on this
# host. Ubuntu 24.04 hosts: hpe-vm --install, which also builds the OVS mgmt
# bridge (-i). No -c/-v: with them hpe-vm puts the Manager VM's NIC on the
# compute bridge, tagged with the -v VLAN (seen 2026-10-10), not on the mgmt
# network its IP belongs to. The compute bridge is set up at cluster creation
# instead. HVM OS 26.04 hosts: hvmcli deploy manager onto the management
# virtSwitch HPE's first boot built (hpe-vm does not exist there).
# Skipped when the Manager already answers.
- name: Look for hvmcli (HVM OS 26.04)
  ansible.builtin.stat:
    path: /opt/hvmcli/bin/hvmcli
  register: hvmcli_bin

- name: Set the installer, its unit and log
  ansible.builtin.set_fact:
    mgr_tool: "{{ 'hvmcli' if hvmcli_bin.stat.exists else 'hpe-vm' }}"
    mgr_unit: "{{ 'vme-stack-hvmcli-deploy' if hvmcli_bin.stat.exists else 'vme-stack-hpe-vm' }}"
    hpe_vm_log: "{{ '/var/log/vme-stack-hvmcli-deploy.log' if hvmcli_bin.stat.exists else '/var/log/vme-stack-hpe-vm-install.log' }}"

- name: Check whether the Manager answers on {{ manager.ip }}
  ansible.builtin.uri:
    url: "https://{{ manager.ip }}/ping"
    validate_certs: false
    timeout: 10
  delegate_to: "{{ probe_from }}"
  register: vme_ping
  failed_when: false

- name: Install the Manager
  when: vme_ping.status | default(0) != 200
  block:
    - name: Read memory and existing VMs
      ansible.builtin.shell: |
        set -o pipefail
        awk '/^MemTotal/ {print int($2/1024/1024)}' /proc/meminfo
        virsh list --all --name | grep -Fx {{ manager.hostname | quote }} || true
      args:
        executable: /bin/bash
      become: true
      register: host_state_mgr
      changed_when: false

    # hpe-vm sizes: S = 12 GB, M = 16 GB, L = 32 GB for the Manager; keep >= 4 GB for the host.
    - name: "Check the host has room for the Manager size: {{ manager.size }}"
      ansible.builtin.assert:
        that: host_state_mgr.stdout_lines[0] | int >= need_gb
        fail_msg: >-
          {{ inventory_hostname }} has {{ host_state_mgr.stdout_lines[0] }} GB RAM; a size {{ manager.size }}
          Manager needs {{ need_gb }} GB here ({{ {'S': 12, 'M': 16, 'L': 32}[manager.size] }} GB + 4 GB for the host)
        quiet: true
      vars:
        need_gb: "{{ {'S': 12, 'M': 16, 'L': 32}[manager.size] + 4 }}"

    - name: Refuse to install over an existing Manager VM that does not answer
      ansible.builtin.assert:
        that: host_state_mgr.stdout_lines | length == 1
        fail_msg: >-
          A VM named {{ manager.hostname }} already exists on {{ inventory_hostname }} but
          https://{{ manager.ip }}/ping does not answer. Check it (virsh list --all) instead of reinstalling.
        quiet: true

    # The output may contain the password: keep the files root-only
    # (script(1) keeps an existing file's mode).
    - name: "Create the installer's log files (root only): {{ mgr_tool }}"
      ansible.builtin.copy:
        content: ""
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop: ["{{ hpe_vm_log }}", "{{ hpe_vm_log }}.rc"]
      become: true

    # Long-running and possibly terminal-hungry: run it as a transient systemd
    # unit under script(1) (a pty), independent of our SSH session; output and
    # exit code go to a root-only log on the host.
    - name: "Start hpe-vm --install, which downloads: {{ vme_image_url }}"
      when: mgr_tool == 'hpe-vm'
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit=vme-stack-hpe-vm
          - --collect
          - --property=TimeoutStartSec=infinity
          - /usr/bin/script
          - -qefc
          - "{{ hpe_vm_argv | map('quote') | join(' ') }}; echo $? > {{ hpe_vm_log }}.rc"
          - "{{ hpe_vm_log }}"
      vars:
        hpe_vm_argv:
          # hpe-vm rejects --option=value ("Invalid argument"); pass value separately.
          - /usr/bin/hpe-vm
          - --install
          - --address
          - "{{ manager.ip }}"
          - --netmask
          - "{{ manager.netmask }}"
          - --gateway
          - "{{ manager.gateway }}"
          - --dns
          - "{{ manager.dns | join(',') }}"
          - --hostname
          - "{{ manager.hostname }}"
          - --url
          - "{{ manager.url }}"
          - --user
          - "{{ manager.admin_user }}"
          - --pass
          - "{{ vme_manager.admin_password }}"
          - --qcow
          - "{{ vme_image_url }}"
          - --size
          - "{{ manager.size }}"
          - --iface
          - "{{ mgmt_interface }}"
      become: true
      changed_when: true
      no_log: true

    - name: Deploy with hvmcli
      when: mgr_tool == 'hvmcli'
      become: true
      vars:
        hvmcli_args:
          - --ip
          - "{{ manager.ip }}"
          - --netmask
          - "{{ manager.netmask }}"
          - --interface
          - "{{ mgmt_vs.virtSwitchName }}"
          - --image
          - "{{ vme_image_url }}"
          - --size
          - "{{ manager.size }}"
        hvmcli_deploy_args:
          - --gateway
          - "{{ manager.gateway }}"
          - --dns
          - "{{ manager.dns | join(',') }}"
          - --hostname
          - "{{ manager.hostname }}"
          - --appliance-url
          - "{{ manager.url }}"
          - --admin-user
          - "{{ manager.admin_user }}"
          - --admin-password-stdin
      block:
        - name: Read the management virtSwitch
          ansible.builtin.command: /opt/hvmcli/bin/hvmcli virtswitch list --json
          register: vswitches
          changed_when: false

        - name: Pick the management virtSwitch
          ansible.builtin.set_fact:
            mgmt_vs: "{{ (vswitches.stdout | from_json).data | default([]) | selectattr('trafficTypes', 'contains', 'management') | first
                         | default(none) }}"

        - name: Check there is a management virtSwitch
          ansible.builtin.assert:
            that: mgmt_vs is not none
            fail_msg: "{{ inventory_hostname }} has no hvmcli virtSwitch with management traffic (hvmcli virtswitch list)"
            quiet: true

        - name: "Precheck the Manager deploy on {{ mgmt_vs.virtSwitchName }}"
          ansible.builtin.command:
            argv: "{{ ['/opt/hvmcli/bin/hvmcli', 'deploy', 'manager', 'precheck'] + hvmcli_args + ['--json'] }}"
          register: hvmcli_precheck
          changed_when: false
          failed_when: false

        - name: Check the precheck passed
          ansible.builtin.assert:
            that:
              - hvmcli_precheck.rc == 0
              - (hvmcli_precheck.stdout | from_json).errorCode | default(1) == 0
            fail_msg: "hvmcli deploy manager precheck refused: {{ hvmcli_precheck.stdout or hvmcli_precheck.stderr }}"
            quiet: true

        # hvmcli reads the password on stdin: from a root-only file in /run,
        # removed once opened, so it is in no argument list and no log.
        - name: Hand the admin password to the deploy
          ansible.builtin.copy:
            content: "{{ vme_manager.admin_password }}"
            dest: /run/vme-stack-manager.pw
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: "Start hvmcli deploy manager, which downloads: {{ vme_image_url }}"
          ansible.builtin.command:
            argv:
              - systemd-run
              - "--unit={{ mgr_unit }}"
              - --collect
              - --property=TimeoutStartSec=infinity
              - /bin/sh
              - -c
              - >-
                exec 3< /run/vme-stack-manager.pw; rm -f /run/vme-stack-manager.pw;
                {{ (['/opt/hvmcli/bin/hvmcli', 'deploy', 'manager'] + hvmcli_args + hvmcli_deploy_args) | map('quote') | join(' ') }}
                <&3 > {{ hpe_vm_log }} 2>&1; echo $? > {{ hpe_vm_log }}.rc
          changed_when: true

    # hpe-vm waits for the Manager's /ping and does not notice when the appliance's
    # own setup (morpheus-ctl reconfigure in the VM) failed: watch that too, through
    # the VM's guest agent, and stop early instead of waiting the full 90 minutes.
    - name: "Wait for the installer, watching the Manager VM's first boot: {{ mgr_tool }}"
      ansible.builtin.script:
        cmd: "manager_firstboot.py {{ mgr_unit }} {{ manager.hostname | quote }}"
        executable: python3
      become: true
      register: hpe_vm_watch
      until: (hpe_vm_watch.stdout | from_json).done
      retries: 180
      delay: 30
      changed_when: false

    - name: "Stop the installer after a failed Manager setup: {{ mgr_tool }}"
      ansible.builtin.systemd_service:
        name: "{{ mgr_unit }}"
        state: stopped
      become: true
      when: (hpe_vm_watch.stdout | from_json).firstboot_failed
      failed_when: false     # it may have ended on its own meanwhile

    - name: Check the Manager VM's first-boot setup
      ansible.builtin.assert:
        that: not watch.firstboot_failed
        fail_msg: >-
          {{ ['The Manager VM ' ~ manager.hostname ~ ' on ' ~ inventory_hostname ~ ' failed its first-boot setup'
              ~ ' (morpheus-ctl reconfigure); from its /var/log/cloud-init-output.log:'] + watch.lines
             + ['A frequent cause: the reverse DNS name of ' ~ manager.ip ~ ' (preflight checks it).'
                ~ (' Fix the cause; hvmcli deploy manager logs --diagnostics shows the deploy, and a VM it'
                   ~ ' left behind must be removed (virsh list --all) before the next run.'
                   if mgr_tool == 'hvmcli' else
                   ' Fix the cause, then remove the VM before the next run: virsh destroy ' ~ manager.hostname
                   ~ '; virsh undefine ' ~ manager.hostname ~ '; rm /var/morpheus/kvm/local/{hpe-vm-essentials-*.qcow2,morpheus-cloud-init.iso}')] }}
        quiet: true
      vars:
        watch: "{{ hpe_vm_watch.stdout | from_json }}"

    - name: "Read the installer's exit code and output: {{ mgr_tool }}"
      ansible.builtin.shell: |
        set -o pipefail
        cat {{ hpe_vm_log }}.rc 2>/dev/null || echo none
        { tail -n 60 {{ hpe_vm_log }} 2>/dev/null || true; } | sed 's/\x1b\[[0-9;]*[A-Za-z]//g; s/\r$//'
      args:
        executable: /bin/bash
      become: true
      register: hpe_vm_result
      changed_when: false
      no_log: true

    # no_log above: the output may echo the password; show it masked.
    - name: "Show the installer's output: {{ mgr_tool }}"
      ansible.builtin.debug:
        msg: "{{ hpe_vm_result.stdout_lines[1:]
                 | map('replace', vme_manager.admin_password, '********') | list }}"

    - name: "Check the installer succeeded: {{ mgr_tool }}"
      ansible.builtin.assert:
        that: hpe_vm_result.stdout_lines[0] | trim == '0'
        fail_msg: >-
          {{ 'hvmcli deploy manager' if mgr_tool == 'hvmcli' else 'hpe-vm --install' }} exited with {{ hpe_vm_result.stdout_lines[0] | trim }},
          see its output above and {{ hpe_vm_log }} on {{ inventory_hostname }}
        quiet: true

# First boot of the appliance configures Morpheus; this takes a while.
- name: "Wait for the Manager to answer /ping: {{ manager.ip }}"
  ansible.builtin.uri:
    url: "https://{{ manager.ip }}/ping"
    validate_certs: false
    timeout: 10
  delegate_to: "{{ probe_from }}"
  register: vme_ping_wait
  until: vme_ping_wait.status | default(0) == 200
  retries: 120
  delay: 30

- name: Manager VM autostart (site setting)
  ansible.builtin.include_tasks: autostart.yml
