---
# Stage 1: preflight. Nothing here changes any machine.
# 1. The site inventory: secrets, variables, rules over the whole site
#    (even with --limit), every problem of a step listed at once.
# 2. Environment checks for the targeted hosts, all collected, then one verdict per host.

# deploy.yml imports several stage playbooks that each import preflight: run it once.
- name: Skip preflight if it already passed in this run
  ansible.builtin.meta: end_play
  when: vme_preflight_passed | default(false) | bool

# --- The site inventory (no machine is contacted; also validate.yml) ----------
- name: Check the site inventory
  ansible.builtin.import_tasks: site.yml

# --- Controller -------------------------------------------------------------

# The Manager's key pair comes from files when the site does not set it inline
# (vme_manager.ssh_private_key_file, default the Manager host's login key).
- name: Note whether the Manager's key pair is read from files
  run_once: true
  ansible.builtin.set_fact:
    manager_key_from_file: "{{ vme_manager is defined and vme_clusters | default([]) | length > 0 and not manager_key_inline | bool }}"

# Private key files on the controller: the deploy server's login, the HVM hosts'
# (ansible_ssh_private_key_file of each, default ~/.ssh/id_ed25519; may be one file)
# and the Manager's key pair.
- name: Check the SSH private keys on the controller
  run_once: true
  delegate_to: localhost
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true                    # a key may be a symlink; its target's mode counts
  loop: "{{ controller_keys }}"
  register: ssh_key
  vars:
    controller_keys: >-
      {{ (([] if hostvars[deploy_host].ansible_connection | default('ssh') == 'local' else [hostvars[deploy_host].ssh_key_file])
          + ansible_play_hosts_all | map('extract', hostvars, 'ssh_key_file') | list
          + ([manager_key_file] if manager_key_from_file | bool else [])) | unique }}

# The HVM hosts get the public key of their key file (ssh_key_file; plus hvm_ssh_keys), so
# the key the controller logs in with is always installed. Paths compared resolved:
# a host's own ansible_ssh_private_key_file comes with symlinks resolved, the same
# key seen through hostvars does not (a symlinked key was left out of the seed). A key with a
# passphrase: ssh-keygen cannot read it unattended, then <key>.pub is used.
- name: Read the public keys of the HVM hosts' private keys
  run_once: true
  delegate_to: localhost
  ansible.builtin.shell: ssh-keygen -y -f "{{ item }}" </dev/null 2>/dev/null || cat "{{ item }}.pub"
  loop: "{{ ssh_key.results | selectattr('stat.exists') | map(attribute='item') | map('realpath') | unique
            | select('in', ansible_play_hosts_all | map('extract', hostvars, 'ssh_key_file') | map('realpath')) | list }}"
  register: hvm_pubkeys
  changed_when: false
  failed_when: false

- name: Collect controller problems
  run_once: true
  vars:
    key_hint: >-
      {{ ' (default ~/.ssh/id_ed25519, else ansible_ssh_private_key_file; in the container only your ~/.ssh'
         ~ ' (mounted by ansible-navigator) and the site directory are there)' }}
  ansible.builtin.set_fact:
    controller_problems: >-
      {%- set out = [] -%}
      {%- for k in ssh_key.results -%}
      {%-   if not k.stat.exists -%}{{ out.append('SSH private key not found: ' ~ k.item ~ key_hint) }}
      {%-   elif k.stat.mode | int(base=8) % 64 != 0 -%}
      {{-     out.append('SSH private key ' ~ k.item ~ ' is readable by others (mode ' ~ k.stat.mode ~ '); ssh will refuse it. chmod 600 it.') -}}
      {%-   endif -%}
      {%- endfor -%}
      {%- for r in hvm_pubkeys.results if r.rc != 0 or not r.stdout.startswith(('ssh-', 'ecdsa-')) -%}
      {{-   out.append('cannot read the public key of ' ~ r.item ~ ' (a key with a passphrase needs ' ~ r.item ~ '.pub next to it)') -}}
      {%- endfor -%}
      {%- if manager_key_from_file | bool
            and lookup('ansible.builtin.file', manager_key_file ~ '.pub', errors='ignore') | default('', true) is not match('(ssh-|ecdsa-)') -%}
      {{-   out.append('the Manager key pair needs the public key ' ~ manager_key_file ~ '.pub next to its private key'
                       ~ ' (vme_manager.ssh_private_key_file; default: the login key of the Manager host)') -}}
      {%- endif -%}
      {{ out }}

- name: Public keys for the admin user (derived + hvm_ssh_keys)
  ansible.builtin.set_fact:
    ssh_keys: >-
      {{ (hvm_pubkeys.results | selectattr('item', 'equalto', ssh_key_file | realpath)
          | selectattr('rc', 'equalto', 0) | map(attribute='stdout') | map('trim') | list
          + hvm_ssh_keys | default([])) | unique }}

# --- Deploy server (builds and serves the ISOs) -----------------------------

- name: Check the deploy server {{ deploy_host }}
  run_once: true
  delegate_to: "{{ deploy_host }}"
  ansible.builtin.shell: |
    set -o pipefail
    sudo -n true 2>/dev/null || echo "user $(id -un) has no passwordless sudo (needed for nginx/xorriso, the ISO mount, SELinux/firewall)"
    command -v apt-get >/dev/null || command -v dnf >/dev/null || echo "neither apt-get nor dnf found (Debian/Ubuntu or RHEL family needed)"
    command -v python3 >/dev/null || echo "python3 missing (DNS/NTP probes)"
    if [ -r {{ hvm_src_iso | quote }} ]; then
      # Every targeted host may need a new ISO, plus a 2 GB margin.
      need_kb=$(( $(du -k {{ hvm_src_iso | quote }} | cut -f1) * {{ ansible_play_hosts | length }} + 2097152 ))
      dir={{ media_www_root | quote }}; while [ ! -d "$dir" ]; do dir=$(dirname "$dir"); done
      free_kb=$(df -Pk "$dir" | awk 'NR==2 {print $4}')
      [ "${free_kb:-0}" -ge "$need_kb" ] || echo "only $(( ${free_kb:-0} / 1024 )) MB free for {{ media_www_root }}, need $(( need_kb / 1024 )) MB"
    else
      echo "stock HVM ISO not found: {{ hvm_src_iso }}"
    fi
    {% if manager.vme_iso | default('') %}
    [ -r {{ manager.vme_iso | quote }} ] || echo "VME software ISO not found: {{ manager.vme_iso }}"
    {% endif %}
    true
  args:
    executable: /bin/bash
  register: deploy_check
  changed_when: false

- name: Hand raw netplan of the targeted hosts to the deploy server
  run_once: true
  delegate_to: "{{ deploy_host }}"
  ansible.builtin.copy:
    content: "{{ raw_netplan | to_json }}"
    dest: "/tmp/vme-stack-netplan-{{ site }}.json"
    mode: "0600"
  vars:
    raw_netplan: >-
      {%- set out = {} -%}
      {%- for h in ansible_play_hosts if hostvars[h].netplan is defined -%}
      {%-   set _ = out.update({h: hostvars[h].netplan}) -%}
      {%- endfor -%}
      {{ out }}
  when: raw_netplan | length > 0
  register: netplan_file
  changed_when: false

- name: Validate raw netplan with netplan's parser
  run_once: true
  delegate_to: "{{ deploy_host }}"
  ansible.builtin.script:
    cmd: "netplan_check.py /tmp/vme-stack-netplan-{{ site }}.json"
    executable: python3
  register: netplan_check
  changed_when: false
  when: netplan_file is not skipped

# --- BMCs (platform redfish) ------------------------------------------------
# Redfish calls go from the controller (boot_redfish delegates to localhost).

- name: Check the Redfish service on {{ bmc.address | default('-') }}
  ansible.builtin.uri:
    url: "https://{{ bmc.address }}/redfish/v1/"
    validate_certs: "{{ bmc.validate_certs | default(false) }}"
    # Without an Accept header Dell iDRAC answers 406 Not Acceptable (Ansible's
    # uri sends none).
    headers:
      Accept: application/json
    timeout: 15
  delegate_to: localhost
  register: bmc_root
  failed_when: false
  when: platform == 'redfish'

- name: Note when netplan's own syntax check is not available
  run_once: true
  ansible.builtin.set_fact:
    netplan_unavailable: >-
      {{ (netplan_check.stdout_lines | select('match', '[{]') | last | from_json).get('_unavailable')
         if netplan_check is defined and netplan_check is not skipped else none }}

# --- DNS and NTP, probed from where the hosts live ---------------------------

# Names the hosts must resolve with the site's DNS servers (they use exactly
# these): the Manager URL's name must give the Manager's IP on every server
# (agents and users reach the Manager by that URL; a wrong record fails the
# cluster step much later); NTP server names must give an address (warning,
# like the other NTP checks).
- name: Names to resolve with the site's DNS servers
  run_once: true
  ansible.builtin.set_fact:
    manager_dns_name: >-
      {{ manager.url | urlsplit('hostname')
         if manager.url is defined and manager.url | urlsplit('hostname') is not match('^[0-9.]+$') else '' }}
    ntp_dns_names: "{{ ntp_servers | reject('match', '^[0-9.]+$') | list }}"

- name: Probe DNS and NTP from {{ probe_from }}
  run_once: true
  delegate_to: "{{ probe_from }}"
  ansible.builtin.script:
    cmd: >-
      net_probe.py --domain {{ domain | quote }}
      --dns {{ dns | join(',') | quote }} --ntp {{ ntp_servers | join(',') | quote }}
      {{ ('--resolve ' ~ resolve_names | join(',') | quote) if resolve_names | length > 0 else '' }}
      --ptr {{ ptr_ips | join(',') | quote }}
    executable: python3
  vars:
    resolve_names: "{{ ([manager_dns_name] if manager_dns_name | length > 0 else []) + ntp_dns_names }}"
    ptr_ips: "{{ (([manager.ip] if manager.ip is defined else []) + ansible_play_hosts_all | map('extract', hostvars, 'ip') | list) | unique }}"
  register: net_probe_raw
  changed_when: false

- name: Evaluate DNS and NTP
  run_once: true
  ansible.builtin.set_fact:
    net_problems: >-
      {{ ([] if dns_ok | length > 0 else ['no DNS server answers from ' ~ probe_from ~ ': ' ~ dns | join(', ')])
         + manager_dns_problems + ptr_findings.problems }}
    net_warnings: >-
      {{ (probe.dns | dict2items | rejectattr('value.ok') |
           map(attribute='key') | map('regex_replace', '^(.*)$', 'DNS server \1 does not answer') | list) +
         ntp_warnings + ntp_dns_warnings + ptr_findings.warnings }}
  vars:
    probe: "{{ net_probe_raw.stdout | from_json }}"
    # Reverse DNS: a machine without a DNS name of its own takes its address's PTR
    # name (hostname -f). The Manager's first-boot setup (morpheus-ctl reconfigure)
    # fails on a PTR name that is no valid host name (e.g. a wildcard *.apps.<domain>
    # left from an old ingress), and hpe-vm then waits for nothing. Manager: invalid
    # name = problem, a valid foreign name = warning; HVM hosts: warnings only.
    ptr_findings: >-
      {%- set out = {'problems': [], 'warnings': []} -%}
      {%- set valid = '^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)(\\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$' -%}
      {%- set machines = [] -%}
      {%- if manager.ip is defined -%}
      {%-   set _ = machines.append({'ip': manager.ip, 'what': 'the Manager', 'name': manager.hostname, 'manager': true}) -%}
      {%- endif -%}
      {%- for h in ansible_play_hosts_all -%}
      {%-   set _ = machines.append({'ip': hostvars[h].ip, 'what': h, 'name': h, 'manager': false}) -%}
      {%- endfor -%}
      {%- for m in machines -%}
      {%-   set names = probe.ptr[m.ip] | default({}) | dict2items | selectattr('value.ok') | map(attribute='value.names')
                        | flatten | map('lower') | map('regex_replace', '[.]$', '') | unique | list -%}
      {%-   set bad = names | reject('match', valid) | list -%}
      {%-   set foreign = names | select('match', valid) | reject('in', [m.name | lower, (m.name ~ '.' ~ domain) | lower]) | list -%}
      {%-   if bad -%}
      {%-     set msg = 'reverse DNS of ' ~ m.ip ~ ' (' ~ m.what ~ ') is ' ~ bad | join(', ') ~ ', no valid host name: '
                        ~ ('the Manager setup (morpheus-ctl reconfigure) fails on it. Delete the PTR record or use another IP.'
                           if m.manager else 'the host may take it as its name. Delete the PTR record.') -%}
      {%-     set _ = (out.problems if m.manager else out.warnings).append(msg) -%}
      {%-   elif foreign -%}
      {%-     set _ = out.warnings.append('reverse DNS of ' ~ m.ip ~ ' (' ~ m.what ~ ') is ' ~ foreign | join(', ')
                                          ~ ', not ' ~ m.name ~ '[.' ~ domain ~ ']; the machine takes it as its full name (hostname -f)') -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
    dns_ok: "{{ probe.dns | dict2items | selectattr('value.ok') | list }}"
    # Servers that do not answer at all are reported (warning) above.
    manager_dns_problems: >-
      {%- set out = [] -%}
      {%- for server, r in probe.resolve[manager_dns_name] | default({}) | dictsort if r.ok and manager.ip not in r.ips -%}
      {{ out.append('DNS server ' ~ server ~ ' resolves the Manager URL name ' ~ manager_dns_name ~ ' to '
                    ~ (r.ips | join(', ') if r.ips else 'nothing') ~ ', expected ' ~ manager.ip) }}
      {%- endfor -%}
      {{ out }}
    ntp_dns_warnings: >-
      {%- set out = [] -%}
      {%- for name in ntp_dns_names -%}
      {%-   for server, r in probe.resolve[name] | default({}) | dictsort if r.ok and not r.ips -%}
      {{ out.append('DNS server ' ~ server ~ ' has no address for NTP server ' ~ name) }}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out }}
    # timesyncd refuses a server whose root distance is over 5 s or that reports itself unsynchronised.
    ntp_warnings: >-
      {%- set out = [] -%}
      {%- for ip, r in probe.ntp.items() -%}
      {%-   if not r.ok -%}{{ out.append('NTP server ' ~ ip ~ ' does not answer (' ~ r.error ~ ')') }}
      {%-   elif r.leap == 3 or r.stratum in [0, 16] -%}
      {{ out.append('NTP server ' ~ ip ~ ' is not synchronised itself (stratum ' ~ r.stratum
                    ~ ', leap ' ~ r.leap ~ ')') }}
      {%-   elif r.root_distance > 5 -%}{{ out.append('NTP server ' ~ ip ~ ' root distance ' ~ r.root_distance ~ ' s > 5 s; timesyncd will reject it') }}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}

# NTP problems only warn (decided 2026-10-09; see spec Decisions log).
- name: Show warnings
  run_once: true
  ansible.builtin.debug:
    msg: >-
      {{ ['WARNING:'] + net_warnings
         + (['raw netplan syntax not checked: ' ~ netplan_unavailable ~ ' (the other netplan rules were checked)']
            if netplan_unavailable | default(none) else []) }}
  when: net_warnings | length > 0 or (netplan_unavailable | default("", true) | length > 0)

- name: Preflight verdict for {{ inventory_hostname }}
  ansible.builtin.assert:
    that: problems | length == 0
    fail_msg: "{{ ['preflight found ' ~ problems | length ~ ' problem(s):'] + problems }}"
    success_msg: "preflight passed"
  vars:
    problems: >-
      {{ controller_problems + net_problems +
         (deploy_check.stdout_lines | map('regex_replace', '^', deploy_host ~ ': ') | list) +
         ([('netplan: ' ~ netplan_result)] if netplan_result else []) +
         (['BMC ' ~ bmc.address ~ ': Redfish service not reachable from the controller ('
           ~ (bmc_root.msg | default(bmc_root.status | default('?'))) ~ ')']
           if platform == 'redfish' and (bmc_root.status | default(0)) != 200 else []) }}
    netplan_result: >-
      {{ (netplan_check.stdout_lines | select('match', '[{]') | last | from_json).get(inventory_hostname)
         if netplan_check is not skipped else none }}

- name: Remember that preflight passed
  ansible.builtin.set_fact:
    vme_preflight_passed: true
