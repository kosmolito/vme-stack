- name: Make sure that the iso path is correct and the file exists [{{ hosted_iso_file }}]
  uri:
    url: "{{ hosted_iso_file }}"
    validate_certs: "{{ srv_validate_certs }}"
    method: HEAD   # vme-stack: was GET, which downloaded the whole ISO
  no_log: "{{ srv_mask_sensitive_output }}"

- name: Pause for 5 seconds
  ansible.builtin.pause:
    seconds: 5

- block:
    - name: Insert virtual media
      ansible.builtin.uri:
        url: "https://{{ srv_ip }}/redfish/v1/Systems/System.Embedded.1/VirtualMedia/1/Actions/VirtualMedia.InsertMedia"
        validate_certs: "{{ srv_validate_certs }}"
        method: POST
        headers:
          X-Auth-Token: "{{ session_token }}"
          Content-Type: "application/json"
        body:
          Image: "{{ hosted_iso_file }}"
          Inserted: true
        body_format: json
        status_code:
          - 200
          - 201
          - 204
      no_log: "{{ srv_mask_sensitive_output }}"
  rescue:
    # Backward compatibility: iDRAC generations older than iDRAC9 6.00 (14G/15G/16G)
    # don't expose Systems/System.Embedded.1/VirtualMedia and require the legacy
    # Managers/iDRAC.Embedded.1/VirtualMedia/CD path instead. Unlike eject, a
    # failure here is still fatal (no ignore_errors) since boot setup depends on
    # the media actually being attached.
    - name: Insert virtual media (legacy path for iDRAC < 9 6.00)
      ansible.builtin.uri:
        url: "https://{{ srv_ip }}/redfish/v1/Managers/iDRAC.Embedded.1/VirtualMedia/CD/Actions/VirtualMedia.InsertMedia"
        validate_certs: "{{ srv_validate_certs }}"
        method: POST
        headers:
          X-Auth-Token: "{{ session_token }}"
          Content-Type: "application/json"
        body:
          Image: "{{ hosted_iso_file }}"
          Inserted: true
        body_format: json
        status_code:
          - 200
          - 201
          - 204
      no_log: "{{ srv_mask_sensitive_output }}"

- name: Pause for 5 seconds
  ansible.builtin.pause:
    seconds: 5