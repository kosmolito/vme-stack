- name: "Set the bios settings - BootMode: {{ srv_BootMode }} SecureBootStatus: {{ srv_SecureBootStatus }}"
  ansible.builtin.uri:
    url: "https://{{ srv_ip }}/redfish/v1/Systems/System.Embedded.1/Bios/Settings"
    validate_certs: "{{ srv_validate_certs }}"
    method: PATCH
    headers: "{{ srv_headers }}"
    body_format: json
    body: 
      Attributes:
        BootMode: "{{ srv_BootMode }}"
        SecureBoot: "{{ srv_SecureBootStatus }}"
    status_code:
      - 200
      - 201
      - 204
  no_log: "{{ srv_mask_sensitive_output }}"

- name: Pause for 5 seconds
  ansible.builtin.pause:
    seconds: 5