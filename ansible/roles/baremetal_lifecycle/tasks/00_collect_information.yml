- name: Create redfish session token
  uri:
    url: "https://{{ srv_ip }}/redfish/v1/SessionService/Sessions"
    validate_certs: "{{ srv_validate_certs }}"
    method: POST
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    body_format: json
    body:
      UserName: "{{ srv_username | string }}"
      Password: "{{ srv_password | string }}"
    return_content: yes
    status_code:
      - 201
      - 401   # some older iDRAC firmware refuses session logins that basic auth accepts
  register: redfish_session
  no_log: "{{ srv_mask_sensitive_output }}"

# Session refused: the same credentials with basic auth (sent with every request).
- name: Check basic auth when the session login is refused
  ansible.builtin.uri:
    url: "https://{{ srv_ip }}/redfish/v1/Systems"
    validate_certs: "{{ srv_validate_certs }}"
    method: GET
    url_username: "{{ srv_username | string }}"
    url_password: "{{ srv_password | string }}"
    force_basic_auth: true
    headers:
      Accept: "application/json"
    status_code:
      - 200
  register: redfish_basic
  failed_when: false
  no_log: "{{ srv_mask_sensitive_output }}"
  when: redfish_session.status == 401

- name: Fail when the BMC refuses the credentials
  ansible.builtin.fail:
    # uri's msg names the HTTP status or the connection error, never the credentials.
    msg: >-
      Redfish login refused by {{ srv_ip }} (session: 401, basic auth: {{ redfish_basic.status | default('-') }}:
      {{ redfish_basic.msg | default('-') }}): {{ 'check the BMC user and password' if redfish_basic.status | default(0) == 401
      else 'the BMC did not answer the basic auth request (e.g. IP blocking after failed logins: iDRAC Settings > Network > IP Blocking)' }}
  when: redfish_session.status == 401 and redfish_basic.status | default(0) != 200

- name: Set session_token and session_id fact
  ansible.builtin.set_fact:
    session_token: "{{ redfish_session.x_auth_token }}"
    session_id: "{{ redfish_session.json.Id }}"
  no_log: "{{ srv_mask_sensitive_output }}"
  when: redfish_session.status == 201

# The headers of every Redfish request below: the session token, or basic auth;
# Accept, as Dell iDRAC answers 406 Not Acceptable without it.
- name: Set the Redfish request headers
  ansible.builtin.set_fact:
    srv_headers: >-
      {{ {'Content-Type': 'application/json', 'Accept': 'application/json'}
         | combine({'X-Auth-Token': session_token} if redfish_session.status == 201
                   else {'Authorization': 'Basic ' ~ ((srv_username | string) ~ ':' ~ (srv_password | string)) | b64encode}) }}
  no_log: "{{ srv_mask_sensitive_output }}"

- block:
    - name: Try collect information from the machine (HPE-style Systems path)
      ansible.builtin.uri:
        url: "https://{{ srv_ip }}/redfish/v1/Systems/1/"
        validate_certs: "{{ srv_validate_certs }}"
        method: GET
        headers: "{{ srv_headers }}"
        status_code:
          - 200
          - 201
          - 204
      register: machine_info
      no_log: "{{ srv_mask_sensitive_output }}"
  rescue:
    - name: Try collect information from the machine (Dell-style Systems path)
      ansible.builtin.uri:
        url: "https://{{ srv_ip }}/redfish/v1/Systems/System.Embedded.1"
        validate_certs: "{{ srv_validate_certs }}"
        method: GET
        headers: "{{ srv_headers }}"
        status_code:
          - 200
          - 201
          - 204
      register: machine_info
      no_log: "{{ srv_mask_sensitive_output }}"

- name: Fail when executed on NON-HPE or NON-Dell. machine
  ansible.builtin.fail:
    msg: "This playbook only supported on HPE and Dell machines."
  when:
    - '"Dell Inc." not in machine_info.json.Manufacturer'
    - '"HPE" not in machine_info.json.Manufacturer'

- name: Set vendor fact to hpe if hw_vendor is hpe
  set_fact:
    vendor: "hpe"
  when: '"HPE" in machine_info.json.Manufacturer'

- name: Set vendor fact to dell if hw_vendor is Dell inc.
  set_fact:
    vendor: "dell"
  when: '"Dell Inc." in machine_info.json.Manufacturer'

- set_fact:
    power_state: "{{ machine_info.json.PowerState }}"
