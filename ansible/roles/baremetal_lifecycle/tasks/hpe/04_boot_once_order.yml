- name: Set the host to boot once from the VirtualMedia device
  ansible.builtin.uri:
    url: "https://{{ srv_ip }}/redfish/v1/Systems/1/"
    validate_certs: "{{ srv_validate_certs }}"
    method: PATCH
    headers: "{{ srv_headers }}"
    body_format: json
    body:
      Boot:
        BootSourceOverrideTarget: "{{ srv_BootSourceOverrideTarget }}"
        BootSourceOverrideEnabled: "Once"
    status_code:
      - 200
      - 201
      - 204
  no_log: "{{ srv_mask_sensitive_output }}"

- name: Pause for 5 seconds
  ansible.builtin.pause:
    seconds: 5