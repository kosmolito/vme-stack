---
# Build the per-host HVM install ISO on the deploy server and publish it over
# HTTP: the stock ISO with /server/{user-data,meta-data} replaced by our seed and
# GRUB timeout set to 0, as hvm-<host>.iso. hvm-<host>.iso.seed next to it holds
# the seed hash it was built from: an unchanged seed is not rebuilt. BMCs and
# hypervisors fetch it from host_iso_url; a host that boots an older copy is
# caught after the install (wait_ssh checks the install id = <host>-<seed hash>).
- name: Set ISO names
  ansible.builtin.set_fact:
    host_iso_name: "hvm-{{ inventory_hostname }}.iso"
    host_iso_url: "{{ media_url }}/isos/hvm-{{ inventory_hostname }}.iso"
    host_work: "{{ media_work_dir }}/{{ inventory_hostname }}"

- name: Check source ISO exists
  ansible.builtin.stat:
    path: "{{ hvm_src_iso }}"
  delegate_to: "{{ deploy_host }}"
  register: src_iso
  failed_when: not src_iso.stat.exists

- name: Read the seed hash of an already built host ISO
  ansible.builtin.shell: >-
    test -f {{ (media_www_root ~ '/isos/' ~ host_iso_name) | quote }}
    && cat {{ (media_www_root ~ '/isos/' ~ host_iso_name ~ '.seed') | quote }} 2>/dev/null || true
  delegate_to: "{{ deploy_host }}"
  register: host_iso_seed
  changed_when: false

- name: Build host ISO
  when: host_iso_seed.stdout | trim != seed_sha
  delegate_to: "{{ deploy_host }}"
  block:
    - name: Create work directory
      ansible.builtin.file:
        path: "{{ host_work }}"
        state: directory
        mode: "0755"

    - name: Upload seed files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/build/{{ inventory_hostname }}/{{ item }}"
        dest: "{{ host_work }}/{{ item }}"
        mode: "0644"
      loop: [user-data, meta-data]

    # xorriso treats an existing -outdev file as an image to add a session to;
    # a leftover from an interrupted build must not be reused.
    - name: Remove a leftover partial ISO
      ansible.builtin.file:
        path: "{{ host_work }}/{{ host_iso_name }}.partial"
        state: absent

    # Every build: a copy kept from an earlier build may come from another HVM ISO.
    - name: Remove the grub.cfg of an earlier build
      ansible.builtin.file:
        path: "{{ host_work }}/grub.cfg"
        state: absent

    - name: Extract stock grub.cfg
      ansible.builtin.command:
        argv: [xorriso, -osirrox, "on", -indev, "{{ hvm_src_iso }}", -extract, /boot/grub/grub.cfg, "{{ host_work }}/grub.cfg"]
      changed_when: true

    - name: Make GRUB boot the installer without waiting
      ansible.builtin.lineinfile:
        path: "{{ host_work }}/grub.cfg"
        regexp: '^set timeout=.*$'
        line: "set timeout=0"

    - name: Write ISO (stock content + our seed + grub.cfg)
      ansible.builtin.command:
        argv:
          - xorriso
          - -indev
          - "{{ hvm_src_iso }}"
          - -outdev
          - "{{ host_work }}/{{ host_iso_name }}.partial"
          - -boot_image
          - any
          - replay
          - -map
          - "{{ host_work }}/user-data"
          - /server/user-data
          - -map
          - "{{ host_work }}/meta-data"
          - /server/meta-data
          - -map
          - "{{ host_work }}/grub.cfg"
          - /boot/grub/grub.cfg
          - -commit
          - -end
      changed_when: true

    # Built outside www_root and moved in whole, so nothing ever downloads a half-written ISO.
    - name: Publish the finished ISO
      ansible.builtin.command:
        argv: [mv, "{{ host_work }}/{{ host_iso_name }}.partial", "{{ media_www_root }}/isos/{{ host_iso_name }}"]
      changed_when: true

    - name: Record the seed hash the ISO was built from
      ansible.builtin.copy:
        content: "{{ seed_sha }}\n"
        dest: "{{ media_www_root }}/isos/{{ host_iso_name }}.seed"
        mode: "0644"

    - name: Remove ISOs of this host named the pre-0.1.4 way (vme-stack-<host>-<hash>.iso)
      ansible.builtin.shell: >-
        find {{ media_www_root | quote }}/isos -maxdepth 1 -name 'vme-stack-{{ inventory_hostname }}-*.iso' -delete
      changed_when: false

# For tools that attach the ISO themselves (lab Terraform reads these files; the
# seed hash tells it the content changed under the same URL).
- name: Record the ISO URL and its seed hash on the controller
  ansible.builtin.copy:
    content: "{{ item.value }}\n"
    dest: "{{ playbook_dir }}/build/{{ inventory_hostname }}/{{ item.file }}"
    mode: "0644"
  loop:
    - {file: iso_url, value: "{{ host_iso_url }}"}
    - {file: iso_seed, value: "{{ seed_sha }}"}
  loop_control:
    label: "{{ item.file }}"
  delegate_to: localhost
