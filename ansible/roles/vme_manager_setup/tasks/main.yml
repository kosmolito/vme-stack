---
# First-time setup of the VME Manager through its setup API (what the browser
# wizard does): master tenant, first admin user, appliance name/URL, no Morpheus
# Hub, license key from the vault or none (trial). Only while the Manager reports
# setupNeeded; afterwards an API login proves the admin account works.
# API calls go from probe_from (the deploy server reaches the Manager).
- name: Ask the Manager whether setup is needed
  ansible.builtin.uri:
    url: "https://{{ vme_manager.ip }}/api/setup/check"
    validate_certs: false
    return_content: true
  delegate_to: "{{ probe_from }}"
  register: vme_setup_check

- name: Run first-time setup
  when: vme_setup_check.json.setupNeeded | default(false) | bool
  ansible.builtin.uri:
    url: "https://{{ vme_manager.ip }}/api/setup/init"
    method: POST
    validate_certs: false
    body_format: json
    body: "{{ setup_body | combine({'licenseKey': lookup('ansible.builtin.vars', vme_manager.license_key_var)}
                                   if vme_manager.license_key_var else {}) }}"
    timeout: 120
    return_content: true
  vars:
    vme_admin_password: "{{ lookup('ansible.builtin.vars', vme_manager.admin_password_var) }}"
    setup_body:
      accountName: "{{ vme_manager.tenant }}"
      username: "{{ vme_manager.admin_user }}"
      password: "{{ vme_admin_password }}"
      confirmPassword: "{{ vme_admin_password }}"
      email: "{{ vme_manager.email }}"
      firstName: VME
      lastName: Admin
      applianceName: "{{ vme_manager.hostname }}"
      applianceUrl: "{{ vme_manager.url }}"
      backups: "off"
      monitoring: "on"
      logs: "on"
      hubMode: skip
  delegate_to: "{{ probe_from }}"
  register: vme_setup
  changed_when: true
  no_log: true

- name: Check setup succeeded
  ansible.builtin.assert:
    that: vme_setup is skipped or (vme_setup.json.success | default(false))
    fail_msg: "Setup failed: HTTP {{ vme_setup.status | default('?') }} {{ vme_setup.json.msg | default(vme_setup.msg | default('')) }}"
    quiet: true

- name: "Log in with the OAuth password grant (as the CLI does): {{ vme_manager.admin_user }}"
  ansible.builtin.uri:
    url: "https://{{ vme_manager.ip }}/oauth/token?grant_type=password&scope=write&client_id=morph-api"
    method: POST
    validate_certs: false
    body_format: form-urlencoded
    body:
      username: "{{ vme_manager.admin_user }}"
      password: "{{ lookup('ansible.builtin.vars', vme_manager.admin_password_var) }}"
    return_content: true
  delegate_to: "{{ probe_from }}"
  register: vme_login
  no_log: true

- name: Read the license status
  ansible.builtin.uri:
    url: "https://{{ vme_manager.ip }}/api/license"
    validate_certs: false
    headers:
      Authorization: "Bearer {{ vme_login.json.access_token }}"
    return_content: true
  delegate_to: "{{ probe_from }}"
  register: vme_license
  no_log: true

- name: Report
  vars:
    license_fields: [licenseType, productTier, startDate, endDate, maxInstances, maxMemory, maxStorage, hardLimit]
  ansible.builtin.debug:
    msg:
      - "Manager {{ vme_manager.url }}: {{ 'set up now' if vme_setup is not skipped else 'already set up' }}, login as {{ vme_manager.admin_user }} works"
      - "License: {{ vme_license.json.license | default({}) | dict2items | selectattr('key', 'in', license_fields) | items2dict
                     | default('none (trial / unlicensed)', true) }}"
