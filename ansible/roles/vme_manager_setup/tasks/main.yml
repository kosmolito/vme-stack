---
# First-time setup of the VME Manager through its setup API (what the browser
# wizard does): master tenant, first admin user, appliance name/URL, no Morpheus
# Hub, license key from the vault or none (trial). Only while the Manager reports
# setupNeeded; afterwards an API login proves the admin account works, a license key
# set later is installed, and a license ending soon is reported.
# API calls go from probe_from (the deploy server reaches the Manager).
- name: Ask the Manager whether setup is needed
  ansible.builtin.uri:
    url: "https://{{ manager.ip }}/api/setup/check"
    validate_certs: false
    return_content: true
  delegate_to: "{{ probe_from }}"
  register: vme_setup_check

- name: Run first-time setup
  when: vme_setup_check.json.setupNeeded | default(false) | bool
  ansible.builtin.uri:
    url: "https://{{ manager.ip }}/api/setup/init"
    method: POST
    validate_certs: false
    body_format: json
    body: "{{ setup_body | combine({'licenseKey': vme_manager.license_key | default('')}
                                   if vme_manager.license_key | default('') else {}) }}"
    timeout: 120
    return_content: true
  vars:
    vme_admin_password: "{{ vme_manager.admin_password }}"
    setup_body:
      accountName: "{{ manager.tenant }}"
      username: "{{ manager.admin_user }}"
      password: "{{ vme_admin_password }}"
      confirmPassword: "{{ vme_admin_password }}"
      email: "{{ manager.email }}"
      firstName: VME
      lastName: Admin
      applianceName: "{{ manager.hostname }}"
      applianceUrl: "{{ manager.url }}"
      backups: "off"
      monitoring: "on"
      logs: "on"
      hubMode: skip
  delegate_to: "{{ probe_from }}"
  register: vme_setup
  changed_when: true
  no_log: true

- name: Check setup succeeded
  ansible.builtin.assert:
    that: vme_setup is skipped or (vme_setup.json.success | default(false))
    fail_msg: "Setup failed: HTTP {{ vme_setup.status | default('?') }} {{ vme_setup.json.msg | default(vme_setup.msg | default('')) }}"
    quiet: true

- name: "Log in with the OAuth password grant (as the CLI does): {{ manager.admin_user }}"
  ansible.builtin.uri:
    url: "https://{{ manager.ip }}/oauth/token?grant_type=password&scope=write&client_id=morph-api"
    method: POST
    validate_certs: false
    body_format: form-urlencoded
    body:
      username: "{{ manager.admin_user }}"
      password: "{{ vme_manager.admin_password }}"
    return_content: true
  delegate_to: "{{ probe_from }}"
  register: vme_login
  no_log: true

- name: Read the license status
  ansible.builtin.uri:
    url: "https://{{ manager.ip }}/api/license"
    validate_certs: false
    headers:
      Authorization: "Bearer {{ vme_login.json.access_token }}"
    return_content: true
  delegate_to: "{{ probe_from }}"
  register: vme_license
  no_log: true

# A key set after the first setup (or a new one replacing a trial or an old key):
# the Manager decodes it without installing it (license/test); install it when no
# installed license has its keyId. Installed licenses stay (the Manager stacks them).
- name: Install the license key of the site
  when: vme_manager.license_key | default('') | length > 0
  block:
    - name: Decode the license key with the Manager
      ansible.builtin.uri:
        url: "https://{{ manager.ip }}/api/license/test"
        method: POST
        validate_certs: false
        headers:
          Authorization: "Bearer {{ vme_login.json.access_token }}"
        body_format: json
        body: {license: "{{ vme_manager.license_key }}"}
        status_code: [200, 400]
        return_content: true
      delegate_to: "{{ probe_from }}"
      register: vme_license_test
      no_log: true

    - name: Check the license key is valid
      ansible.builtin.assert:
        that: vme_license_test.status == 200 and vme_license_test.json.license.keyId is defined
        fail_msg: >-
          The Manager rejects vme_manager.license_key: {{ vme_license_test.json.msg | default('HTTP ' ~ vme_license_test.status) }}
        quiet: true

    - name: Install the license
      ansible.builtin.uri:
        url: "https://{{ manager.ip }}/api/license"
        method: POST
        validate_certs: false
        headers:
          Authorization: "Bearer {{ vme_login.json.access_token }}"
        body_format: json
        body: {license: "{{ vme_manager.license_key }}"}
        status_code: [200, 400]
        return_content: true
      delegate_to: "{{ probe_from }}"
      register: vme_license_install
      when: vme_license_test.json.license.keyId not in installed_ids
      changed_when: true
      no_log: true
      vars:
        installed_ids: "{{ vme_license.json.installedLicenses | default([]) | map(attribute='keyId') | list }}"

    - name: Read the license status again
      ansible.builtin.uri:
        url: "https://{{ manager.ip }}/api/license"
        validate_certs: false
        headers:
          Authorization: "Bearer {{ vme_login.json.access_token }}"
        return_content: true
      delegate_to: "{{ probe_from }}"
      register: vme_license_after
      when: vme_license_install is not skipped
      no_log: true

    # The answer has no success flag (API docs 9.0/9.1): check the key is installed now.
    - name: Check the license was installed
      ansible.builtin.assert:
        that: vme_license_test.json.license.keyId in vme_license_after.json.installedLicenses | default([]) | map(attribute='keyId') | list
        fail_msg: >-
          Installing the license failed: HTTP {{ vme_license_install.status | default('?') }}
          {{ vme_license_install.json.msg | default(vme_license_install.msg | default('')) }}
        quiet: true
      when: vme_license_install is not skipped

# The status after an install, else the first read (a skipped task still registers).
- name: Note the current license status
  ansible.builtin.set_fact:
    vme_license_now: >-
      {{ (vme_license_after if vme_license_after is defined and vme_license_after is not skipped else vme_license).json }}
  no_log: true

- name: Report
  vars:
    license_fields: [licenseType, productTier, startDate, endDate, maxInstances, maxMemory, maxStorage, hardLimit]
  ansible.builtin.debug:
    msg:
      - "Manager {{ manager.url }}: {{ 'set up now' if vme_setup is not skipped else 'already set up' }}, login as {{ manager.admin_user }} works"
      - "License: {{ vme_license_now.license | default({}) | dict2items | selectattr('key', 'in', license_fields) | items2dict
                     | default('none (trial / unlicensed)', true) }}"

# A license that has ended or ends within 30 days (a trial lasts 60): a warning,
# the run goes on. With hardLimit the Manager stops provisioning when it ends.
- name: Warn about the license end date
  ansible.builtin.debug:
    msg: >-
      WARNING: the Manager's license ({{ lic.productTier | default('?') }}) {{ 'ended' if days | int < 0 else 'ends' }}
      {{ lic.endDate[:10] }} ({{ days | int | abs }} days {{ 'ago' if days | int < 0 else 'from now' }}).
      {{ todo }} and run deploy.yml or vme_manager.yml again,
      or install it in the Manager (Administration > Settings > License).
  vars:
    todo: >-
      {{ 'Set vme_manager.license_key (vault) to a new key' if vme_manager.license_key | default('') | length == 0
         else 'Put the new key in vme_manager.license_key' }}
    lic: "{{ vme_license_now.license | default({}) }}"
    days: "{{ (((lic.endDate | to_datetime('%Y-%m-%dT%H:%M:%SZ')) - now(utc=true)).total_seconds() / 86400) | round | int }}"
  when: lic.endDate | default('', true) | length > 0 and days | int <= 30

# Outgoing mail (vme_manager.smtp): the appliance settings' SMTP fields (PUT
# /api/appliance-settings; same fields in API 9.0.2 and 9.1.0). Set when a field differs
# from the site; without smtp in the site the Manager's own settings stay.
# The Manager shows the password only masked (and as a salted hash of its own), so the
# run keeps a fingerprint of the password it set (salted SHA-256) in the Manager's
# Cypher store and sends the password again when the site's password no longer matches
# it. -e smtp_password_update=true sends it anyway (e.g. after a change in the UI).
- name: Set the Manager's SMTP settings
  when: manager.smtp | length > 0
  vars:
    smtp_want:
      smtpServer: "{{ manager.smtp.host }}"
      smtpPort: "{{ manager.smtp.port }}"
      smtpMailFrom: "{{ manager.smtp['from'] }}"
      smtpTLS: "{{ manager.smtp.tls }}"
      smtpSSL: "{{ manager.smtp.ssl }}"
      smtpUser: "{{ manager.smtp.user }}"
    smtp_password: "{{ vme_manager.smtp.password | default('') }}"
    smtp_cypher_url: "https://{{ manager.ip }}/api/cypher/secret/vme-stack/smtp-password"
  block:
    - name: Read the appliance settings
      ansible.builtin.uri:
        url: "https://{{ manager.ip }}/api/appliance-settings"
        validate_certs: false
        headers:
          Authorization: "Bearer {{ vme_login.json.access_token }}"
        return_content: true
      delegate_to: "{{ probe_from }}"
      register: vme_appliance
      no_log: true

    - name: Read the fingerprint of the SMTP password set last
      ansible.builtin.uri:
        url: "{{ smtp_cypher_url }}"
        validate_certs: false
        headers:
          Authorization: "Bearer {{ vme_login.json.access_token }}"
        status_code: [200, 404]
        return_content: true
      delegate_to: "{{ probe_from }}"
      register: vme_smtp_record
      when: smtp_password | length > 0
      no_log: true

    # Fields that differ (the Manager keeps an empty user as null), and the password.
    - name: Compare the SMTP settings with the site
      ansible.builtin.set_fact:
        smtp_diff: >-
          {%- set out = [] -%}
          {%- for k, v in smtp_want.items() if (have[k] | default('', true) | string) != (v | default('', true) | string) -%}
          {{-   out.append(k) -}}
          {%- endfor -%}
          {%- if smtp_password | length > 0 and (smtp_password_update | default(false) | bool
                or (record.salt | default('') ~ smtp_password) | hash('sha256') != record.fingerprint | default('')) -%}
          {{-   out.append('smtpPassword') -}}
          {%- endif -%}
          {{ out }}
      vars:
        have: "{{ vme_appliance.json.applianceSettings }}"
        record: >-
          {{ vme_smtp_record.json.data | default({}) if vme_smtp_record is not skipped and vme_smtp_record.status == 200 else {} }}
      no_log: true

    - name: "Set the SMTP settings: {{ smtp_diff | join(', ') | default('none', true) }}"
      ansible.builtin.uri:
        url: "https://{{ manager.ip }}/api/appliance-settings"
        method: PUT
        validate_certs: false
        headers:
          Authorization: "Bearer {{ vme_login.json.access_token }}"
        body_format: json
        body:
          applianceSettings: >-
            {{ smtp_want | combine({'smtpUser': manager.smtp.user | default(none, true)})
               | combine({'smtpPassword': smtp_password} if smtp_password | length > 0 else {}) }}
        status_code: [200, 400]
        return_content: true
      delegate_to: "{{ probe_from }}"
      register: vme_smtp_set
      when: smtp_diff | length > 0
      changed_when: true
      no_log: true

    - name: Check the SMTP settings were accepted
      ansible.builtin.assert:
        that: vme_smtp_set.json.success | default(false)
        fail_msg: >-
          The Manager refused the SMTP settings: HTTP {{ vme_smtp_set.status | default('?') }}
          {{ vme_smtp_set.json.msg | default('') }} {{ vme_smtp_set.json.errors | default({}) }}
        quiet: true
      when: vme_smtp_set is not skipped

    # set_fact fixes the value: a lookup in vars runs again at each use (salt and
    # fingerprint would get different salts).
    - name: Make a salt for the SMTP password fingerprint
      ansible.builtin.set_fact:
        smtp_salt: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['hexdigits']) }}"
      when: vme_smtp_set is not skipped and smtp_password | length > 0
      no_log: true

    - name: Store the fingerprint of the SMTP password
      ansible.builtin.uri:
        url: "{{ smtp_cypher_url }}?ttl=0"
        method: POST
        validate_certs: false
        headers:
          Authorization: "Bearer {{ vme_login.json.access_token }}"
        body_format: json
        body:
          salt: "{{ smtp_salt }}"
          fingerprint: "{{ (smtp_salt ~ smtp_password) | hash('sha256') }}"
        return_content: true
      delegate_to: "{{ probe_from }}"
      when: vme_smtp_set is not skipped and smtp_password | length > 0
      changed_when: true
      no_log: true

    # The Manager hands SMTP settings to its mail sender at startup only (seen on 9.0.2:
    # settings set through the API were still unused 20 minutes later; after a restart of
    # morpheus-ui mail went out). Restart through the VM's guest agent, then wait for it.
    - name: Restart the Manager's UI service so it uses the new SMTP settings
      ansible.builtin.script:
        cmd: "manager_exec.py {{ manager.hostname | quote }} /opt/morpheus/bin/morpheus-ctl restart morpheus-ui"
        executable: python3
      become: true
      register: vme_ui_restart
      when: vme_smtp_set is not skipped and manager.smtp.restart_webui_on_update
      changed_when: true
      failed_when: (vme_ui_restart.stdout | from_json).rc != 0

    - name: "Wait for the Manager to answer /ping again: {{ manager.ip }}"
      ansible.builtin.uri:
        url: "https://{{ manager.ip }}/ping"
        validate_certs: false
        timeout: 10
      delegate_to: "{{ probe_from }}"
      register: vme_ping_restart
      until: vme_ping_restart.status | default(0) == 200
      retries: 90
      delay: 20
      when: vme_ui_restart is not skipped

    - name: Report the SMTP settings
      ansible.builtin.debug:
        msg: >-
          SMTP: {{ manager.smtp.host }}:{{ manager.smtp.port }} from {{ manager.smtp['from'] }}
          ({{ 'STARTTLS' if manager.smtp.tls else 'TLS' if manager.smtp.ssl else 'no TLS' }},
          {{ 'login ' ~ manager.smtp.user if manager.smtp.user else 'no login' }}){{ ', set now' if vme_smtp_set is not skipped else '' }}{{
          ' (morpheus-ui restarted)' if vme_ui_restart is not skipped else
          '; they apply at the next restart of morpheus-ui (smtp.restart_webui_on_update: false)' if vme_smtp_set is not skipped else '' }}
