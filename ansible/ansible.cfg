[defaults]
roles_path = roles
inventory_plugins = plugins/inventory
filter_plugins = plugins/filter
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = False
forks = 5

[inventory]
# Inventory comes from a site file: -i ../sites/<site>/site.yml
enable_plugins = vme_site
# A site file that fails the schema must stop the run, not leave an empty inventory.
any_unparsed_is_failed = True

[ssh_connection]
pipelining = True
