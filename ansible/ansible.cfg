[defaults]
roles_path = roles
filter_plugins = plugins/filter
# The key Ansible logs in with unless a host sets ansible_ssh_private_key_file. In
# the container ~/.ssh is the user's own (ansible-navigator mounts it).
private_key_file = ~/.ssh/id_ed25519
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = False
forks = 5

[inventory]
# The site file is a plain Ansible inventory: -i ../sites/<site>/site.yml
enable_plugins = yaml, ini, auto
# A site file that cannot be parsed must stop the run, not leave an empty inventory.
any_unparsed_is_failed = True

[ssh_connection]
pipelining = True
