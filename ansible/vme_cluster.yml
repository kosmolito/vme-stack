---
# Stage 7: groups, clouds and HVM clusters (vme_groups, vme_clouds, vme_clusters), created by the Manager.
# Run after vme_manager.yml:
#   ansible-playbook vme_cluster.yml -i ../sites/<site>/site.yml --vault-password-file <file>
- name: Preflight
  ansible.builtin.import_playbook: preflight.yml

- name: Groups, clouds and HVM clusters
  hosts: vme_manager
  gather_facts: false
  roles:
    - role: vme_cluster
      when: vme_groups | length > 0 or vme_clouds | length > 0 or vme_clusters | length > 0
