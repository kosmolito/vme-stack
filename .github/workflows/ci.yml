# Lint and site tests on every pull request and push to main.
# Same checks locally: task check (Taskfile.yml).
# Skipped when only files no check reads change (a commit touching anything else runs
# in full). Not README.md, CHANGELOG.md, ee/README.md, ansible/examples/README.md,
# docs/variables.md: task test checks their version pins and generated content.
name: ci

on:
  pull_request:
    paths-ignore:
      - spec.md
      - CLAUDE.md
      - sites/example/README.md
      - ansible/roles/*/README.md
  push:
    branches: [main]
    paths-ignore:
      - spec.md
      - CLAUDE.md
      - sites/example/README.md
      - ansible/roles/*/README.md

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # task lint / task test build .venv from requirements-dev.txt themselves
      - name: Install task
        run: pip install "$(grep -o '^go-task-bin==[0-9.]*' requirements-dev.txt)"

      - name: Lint
        run: task lint

  site-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # task lint / task test build .venv from requirements-dev.txt themselves
      - name: Install task
        run: pip install "$(grep -o '^go-task-bin==[0-9.]*' requirements-dev.txt)"

      - name: Tests
        run: task test
