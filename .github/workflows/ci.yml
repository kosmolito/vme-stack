# Lint and site tests on every pull request and push to main.
# Same checks locally: task check (Taskfile.yml).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # task lint / task test build .venv from requirements-dev.txt themselves
      - name: Install task
        run: pip install "$(grep -o '^go-task-bin==[0-9.]*' requirements-dev.txt)"

      - name: Lint
        run: task lint

  site-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # task lint / task test build .venv from requirements-dev.txt themselves
      - name: Install task
        run: pip install "$(grep -o '^go-task-bin==[0-9.]*' requirements-dev.txt)"

      - name: Tests
        run: task test
