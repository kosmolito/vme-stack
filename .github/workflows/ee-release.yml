# Build the vme-stack execution environment and push it to GHCR, for
# linux/amd64 and linux/arm64 (e.g. Apple Silicon clients).
# Trigger: push a tag vX.Y.Z that matches ee/VERSION: task release VERSION=X.Y.Z,
# then task release:push (Taskfile.yml, ee/README.md).
# Result: ghcr.io/<owner>/vme-stack-ee:X.Y.Z and :latest (multi-arch), then the
# GitHub release vX.Y.Z with the version's CHANGELOG section as its notes.
name: ee-release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]   # vX.Y.Z only; e.g. v.0.1.0 does not start a run
  workflow_dispatch:          # manual run: builds both architectures and tests, no push

permissions:
  contents: read
  packages: write             # push to GHCR with the repository's GITHUB_TOKEN

jobs:
  ee:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version=$(cat ee/VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vme-stack-ee" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match ee/VERSION ($version)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-builder and task
        run: pip install ansible-builder "$(grep -o '^go-task-bin==[0-9.]*' requirements-dev.txt)"

      # Native (amd64) build, loaded into the local Docker for the smoke test.
      - name: Build the EE (amd64, local)
        env:
          VME_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: task ee:build

      # Inside the image: tools present, and the site schema/rules load the example site.
      - name: Smoke test (amd64)
        run: task ee:smoke

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: build both architectures and push. Manual runs: build only.
      - name: Build (and push) amd64 + arm64
        env:
          VME_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          PLATFORMS: linux/amd64,linux/arm64
          IMAGE: ${{ steps.version.outputs.image }}
          PUSH: ${{ github.ref_type == 'tag' }}
        run: task ee:build

      - name: Check the pushed image (both architectures, arm64 run under QEMU)
        if: github.ref_type == 'tag'
        run: |
          v=${{ steps.version.outputs.version }}
          img=${{ steps.version.outputs.image }}
          docker buildx imagetools inspect "$img:$v"
          docker buildx imagetools inspect "$img:$v" | grep -q "linux/arm64"
          docker run --rm --platform linux/arm64 "$img:$v" bash -c 'uname -m; ansible --version | head -1; /usr/bin/python3.12 -c "import passlib"'
          echo "Pushed $img:$v and $img:latest (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"

  # The GitHub release, once the image is pushed and checked (a failed build gets
  # none). A re-run updates the existing release.
  release:
    needs: ee
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write         # create the release; the build job stays read-only
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Write the release notes (CHANGELOG section, image, tested with)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/vme-stack-ee
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: python3 scripts/release.py notes "${GITHUB_REF_NAME#v}" --image "${IMAGE,,}" --repo "$REPO" > notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="vme-stack ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --notes-file notes.md
          fi
          echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
